name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request: # any

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and Analyze Tests
        run: mvn -B clean verify -Dmaven.test.failure.ignore=false